
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danish - Kudsan</title>
    
    <!-- 1. ดึงฟอนต์ Kanit มาใช้เพื่อให้เหมือนกันทุกเครื่อง -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* 2. ตั้งค่าพื้นฐาน */
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif; /* ใช้ฟอนต์ Kanit ทั้งหมด */
        }

        body { 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 0; 
            color: #333;
        }

        header { 
            background: #ff9f43; 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
        }

        header h1 {
            font-size: 36px; /* ปรับขนาดให้พอดีกับมือถือ */
            font-weight: bold;
            margin: 0;
            color: #ffffff;
        }

        /* แถบเมนู Tabs */
        .tabs { 
            display: flex; 
            justify-content: center; 
            background: #fff; 
            border-bottom: 2px solid #ddd; 
            overflow-x: auto; /* ให้มือถือปัดซ้ายขวาได้ถ้าเมนูยาว */
            white-space: nowrap;
        }

        .tab-item { 
            padding: 15px 20px; 
            text-decoration: none; 
            color: #333; 
            font-weight: bold;
            font-size: 16px;
        }

        .active { 
            border-bottom: 4px solid #ff9f43; 
            color: #ff9f43; 
        }

        .container { 
            max-width: 1080px; 
            margin: 20px auto; 
            padding: 0 20px 20px 20px; 
        }

        .search-box { 
            width: 100%; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            margin-top: 20px;
            margin-bottom: 20px; 
            font-size: 16px;
            outline: none;
        }

        /* สไตล์การ์ดสินค้า */
        #productList {
            display: grid;
            grid-template-columns: 1fr; /* มือถือโชว์แถวละ 1 */
            gap: 15px;
        }

        .product-card { 
            background: #ffffff; 
            padding: 15px; 
            border-radius: 12px; 
            border-left: 5px solid #ff9f43; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .product-card a {
            text-decoration: none;
            color: #000;
        }

        .product-card h3 {
            margin: 0;
            font-size: 18px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            text-decoration: none;
            color: #666;
            font-weight: bold;
        }

        /* --- Media Queries สำหรับหน้าจอใหญ่ (iPad / PC) --- */
        @media (min-width: 600px) {
            #productList {
                grid-template-columns: 1fr 1fr; /* ไอแพดโชว์แถวละ 2 */
            }
            header h1 { font-size: 45px; }
        }

        @media (min-width: 1000px) {
            #productList {
                grid-template-columns: 1fr 1fr 1fr 1fr; /* คอมโชว์แถวละ 3 */
            }
        }
    </style>
</head>
<body>

<header>
    <h1>สินค้าเดนิช (Danish)</h1>
</header>

<div class="tabs">
    <a href="index.html" class="tab-item">ทั้งหมด</a>
    <a href="New Product.html" class="tab-item">New Product</a>
    <a href="bread.html" class="tab-item">หมวดขนมปัง</a>
    <a href="Croissant.html" class="tab-item">หมวดครัวซองต์</a>
    <a href="pie.html" class="tab-item">หมวดพาย</a>
    <a href="Danish.html" class="tab-item active">หมวดเดนิช</a>
    <a href="Sandwich.html" class="tab-item">หมวดแซนด์วิช</a>
    <a href="Donut.html" class="tab-item">หมวดโดนัท</a>
    <a href="Pizza.html" class="tab-item">หมวดพิซซ่า</a>
    <a href="Vegan.html" class="tab-item">หมวดสินค้า เจ</a>
</div>

<div class="container">
    <input type="text" id="searchInput" class="search-box" onkeyup="searchFn()" placeholder="🔍 ค้นหาขนมที่นี่...">

    <div id="productList">
        <!-- สินค้า 1 -->
        <div class="product-card" data-name="ขนมปังพิซซ่าไส้กรอกไก่">
            <a href="https://www.canva.com/design/DAHE2vMNpns/mmnovCqOQGWKiLVdAjqZjg/watch?utm_content=DAHE2vMNpns&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h483f9df481" target="_blank">
                <h3>ขนมปังพิซซ่าไส้กรอกไก่</h3>
            </a>
        </div>

        <!-- สินค้า 2 -->
        <div class="product-card" data-name="ช็อกโกแลตเพรทเซล">
            <a href="https://www.canva.com/design/DAHE2iPmII8/s1BehAfdGiJlVPWxzt4Fnw/watch?utm_content=DAHE2iPmII8&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=hb923e63d09" target="_blank">
                <h3>ช็อกโกแลตเพรทเซล</h3>
            </a>
        </div>

        <!-- สินค้า 3 -->
        <div class="product-card" data-name="ชิโอะปังรสซาวโดว์ KS">
            <a href="https://www.canva.com/design/DAHE2rjJN5E/n5wVDUUl4ErEjEu901QngA/watch?utm_content=DAHE2rjJN5E&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h3468c0eaf3" target="_blank">
                <h3>ชิโอะปังรสซาวโดว์ KS</h3>
            </a>
        </div>

        <!-- สินค้า 4 -->
        <div class="product-card" data-name="ขนมปังเนย">
            <a href="https://www.canva.com/design/DAHE2rdW3oA/E7NDWIHFQRYkdgGj_smCBg/watch?utm_content=DAHE2rdW3oA&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h44ad296438" target="_blank">
                <h3>ขนมปังเนย</h3>
            </a>
        </div>

        <!-- สินค้า 5 -->
        <div class="product-card" data-name="พิซซ่าไก่บาร์บีคิวซอสเทาซัน">
            <a href="https://www.canva.com/design/DAHE2pTKYJY/KvO9oggUw77mi6cRb9rznQ/watch?utm_content=DAHE2pTKYJY&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=hc6a77d5b6c" target="_blank">
                <h3>พิซซ่าไก่บาร์บีคิวซอสเทาซัน</h3>
            </a>
        </div>

        <!-- สินค้า 6 -->
        <div class="product-card" data-name="ครีมมี่ครัวซองต์">
            <a href="https://www.canva.com/design/DAHE2v0JtYs/rgm9GESwDdNl0AqNJrv99g/watch?utm_content=DAHE2v0JtYs&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h27042b9b52" target="_blank">
                <h3>ครีมมี่ครัวซองต์</h3>
            </a>
        </div>
    </div>

    <a href="index.html" class="back-link">← กลับหน้าหลัก</a>
</div>

<script>
    function searchFn() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('product-card');

        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].getAttribute('data-name');
            if (name.toLowerCase().includes(input)) {
                cards[i].style.display = "block";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>

</body>
</html>
